#####  ── GENERAL PREFERENCES ────────────────────────────────────────────
# 1) single-key prefix ───────────────────────────────────────────────────
set -g prefix `                  # back-tick becomes primary prefix
unbind C-a                       # drop the old Ctrl-A
bind ` send-prefix               # allow `` to send a literal back-tick

set -g prefix2 C-\\
unbind -n C-\\
bind -n C-\\ send-prefix -2

bind T choose-tree

# 100 k lines of scrollback per pane.
set -g history-limit 100000

# Mouse: scroll, select panes, drag to resize.
set -g mouse off

# Use Vim keys in copy-mode.
set -g mode-keys vi

#####  ── CLIPBOARD (OSC 52) ─────────────────────────────────────────────
# Let tmux mirror yanks to your system clipboard via OSC 52.
# Works locally and over SSH when the terminal supports it.
# See: https://github.com/tmux/tmux/wiki/Clipboard
set -s set-clipboard on

# Tell tmux that common terminals support clipboard via OSC 52.
# (Harmless if redundant; helpful if missing.)
set -as terminal-features ',xterm*:clipboard,tmux*:clipboard,screen*:clipboard'

#####  ── PANE / WINDOW QUALITY-OF-LIFE ──────────────────────────────────
# Splits that feel like Vim.
bind |  split-window  -h -c "#{pane_current_path}"
bind -  split-window  -v -c "#{pane_current_path}"

# Navigate panes with Ctrl-h/j/k/l (no prefix needed).
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize panes quickly: prefix + arrows.
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 3
bind -r Down  resize-pane -D 3

# Zoom/unzoom the current pane.
bind z resize-pane -Z

# Fast reload of this file.
bind r source-file ~/.tmux.conf \; display "✓ reloaded ~/.tmux.conf"

#####  ── QUICK PANE & WINDOW CYCLING ────────────────────────────────────
# after *either* prefix:
bind -r Tab  select-pane -t :.+     # ` Tab           next pane
bind -r BTab select-pane -t :.-     # ` Shift-Tab     previous pane
# no prefix:
bind -n C-Tab  next-window          # Ctrl-Tab        next window
bind -n C-BTab previous-window      # Ctrl-Shift-Tab  previous window

#####  ── LAYOUT CONTROLS ────────────────────────────────────────────────
bind 0  select-layout tiled           # prefix 0  → rebalance to an even grid
bind L  select-layout -n              # prefix Shift-L cycles through presets
bind =  select-layout even-horizontal # prefix =  → rows of equal height
bind \; select-layout even-vertical   # prefix ;  → columns of equal width

##### ── BELL-ONLY “TAKE-ME-THERE”  ──────────────────────────────────────
# 1) we ignore ordinary background output …
set -g monitor-activity off          # no flags for mere output
# …but keep bells: when a pane rings ^G, mark its window
set -g bell-action other
set -g visual-bell off

# 2) quick jumps to the *next / previous* alert window (bell flag only)
bind -n M-n next-window -a        # Option-n  → next window with unseen bell
bind -n M-p previous-window -a    # Option-p  → previous bell window

# 3) prefix t  → chooser filtered to *only* windows that still carry a bell
bind t choose-tree -w -f '#{?window_bell_flag,1,}'

# 4) red dot on the right when this session still has unseen bells
set -g status-right '#{?session_alerts,#[fg=colour1]●#[default] ,} %Y-%m-%d %H:%M '

##### ────────────────────────────────────────────────────────────────────
# vi mode appearance
set -g mode-style "bg=colour238,fg=colour226"

#####  ── STATUS BAR (minimal) ───────────────────────────────────────────
set -g status-left  "#[bold]#S"         # session name

####── Miscellaneous ─────────────────────────────────────────────────────
# Prefix + s  → toggle broadcast
bind s setw synchronize-panes \; display-message "sync-panes #{?synchronize-panes,ON,OFF}"

#####  ── PLUGINS (TPM) ──────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# You can keep tmux-yank installed for extras; our bindings below override its copy-mode keys.
set -g @plugin 'tmux-plugins/tmux-yank'

# Auto-save + auto-restore every 15 min.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager.
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run-shell -b "~/.tmux/plugins/tpm/tpm"'

#####  ── VIMMY COPY‑MODE (exactly what you expect) ──────────────────────


# Start/shape a selection like Vim:
bind -T copy-mode-vi v     send -X begin-selection  # visual
bind -T copy-mode-vi V     send -X select-line      # visual line
bind -T copy-mode-vi C-v   send -X rectangle-toggle # visual block

# y: copy but STAY in copy-mode
bind -T copy-mode-vi y if-shell -F "#{selection_active}" \
  "send -X copy-selection" \
  "send -X copy-line"

# Enter (or C-y): copy & EXIT copy-mode
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi C-y   send -X copy-selection-and-cancel

bind -T copy-mode-vi Y     send -X copy-line
bind -T copy-mode-vi Escape send -X cancel


#####  ── 24-bit colour & undercurl ──────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

##### ── (Optional) YANKING HELPERS OUTSIDE COPY‑MODE ────────────────────
# If you like your old "prefix + y y" behavior to yank the current shell line,
# keep these. They rely on tmux-yank; harmless if you remove them later.
bind-key y switch-client -T yank-table
bind-key -T yank-table y  run-shell "~/.tmux/plugins/tmux-yank/scripts/copy_line.sh" \
  \; display-message '⤴  yanked whole line' \
  \; switch-client -T root

# Yank last command (prefix + l) – completely silent
bind-key   l  send-keys C-g
